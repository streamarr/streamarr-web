# Movie and Episode payloads carry the same card fields as Home, so uncached additions can
# enter Continue Watching without a query. Related Seasons and Series keep their own watch state.
subscription WatchStateChanged {
  watchStateChanged {
    continueWatching {
      itemId
      edge {
        ...ContinueWatchingEdgeFields
      }
    }
    items {
      __typename
      ... on Movie {
        ...MovieWatchState
        lastWatchedAt
        unmatched
        library {
          id
        }
      }
      ... on Episode {
        ...EpisodeWatchState
      }
      ... on Season {
        ...SeasonWatchState
      }
      ... on Series {
        ...SeriesWatchState
        lastWatchedAt
        unmatched
        library {
          id
        }
      }
    }
  }
}
