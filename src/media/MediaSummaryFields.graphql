fragment MediaSummaryFields on Media {
  __typename
  ... on Movie {
    id
    title
    titleSort
    releaseDate
    runtime
    selectedProfileState {
      watchState {
        watchStatus
        lastWatchedAt
        watchProgress {
          percentComplete
        }
      }
    }
    images(type: POSTER) {
      aspectRatio
      blurHash
      variants {
        id
        size
        width
        height
        url
      }
    }
  }
  ... on Series {
    id
    title
    titleSort
    firstAirDate
    seasons {
      id
    }
    selectedProfileState {
      watchState {
        watchStatus
        lastWatchedAt
        watchProgress {
          percentComplete
        }
      }
    }
    images(type: POSTER) {
      aspectRatio
      blurHash
      variants {
        id
        size
        width
        height
        url
      }
    }
  }
}
