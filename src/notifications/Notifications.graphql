# A Notification as the Notifications page shows it.
fragment NotificationFields on Notification {
  __typename
  id
  message
  latestEventAt
  unread
  ... on RequestNotification {
    expiresAt
    resolution
  }
  ... on ProfileShareOfferedNotification {
    answer
  }
}

# The same edge in a page of the list and in a change to it.
fragment NotificationEdgeFields on NotificationEdge {
  ...OrderedEdgeFields
  node {
    ...NotificationFields
  }
}

query Notifications($first: Int, $after: String) {
  notifications(first: $first, after: $after) {
    edges {
      ...NotificationEdgeFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation MarkNotificationsRead($input: MarkNotificationsReadInput!) {
  markNotificationsRead(input: $input) {
    unreadNotificationCount
    userErrors {
      __typename
      ... on MutationError {
        message
      }
    }
  }
}

subscription NotificationsChanged {
  notificationsChanged {
    notifications {
      notificationId
      edge {
        ...NotificationEdgeFields
      }
    }
    unreadNotificationCount
  }
}

# The count after the Notifications entry in the Profile menu.
query UnreadNotificationCount {
  unreadNotificationCount
}
