fragment SharedProfileFields on ProfileSummary {
  id
  name
  picture
  kind
  personalProfile
  restricted
}

# An offer as Share offers lists it.
fragment ShareOfferFields on ProfileShare {
  id
  profileId
  householdId
  status
  expiresAt
  profile {
    ...SharedProfileFields
  }
  offeredByDisplayName
  visitor
}

# A share of the Account's Personal Profile as Sharing lists it.
fragment ProfileShareFields on ProfileShare {
  id
  householdId
  status
  requiredByAccountMembership
  expiresAt
  endedAt
  invalidationReason
  household {
    id
    name
  }
}

# A share carries every field that a list of shares reads, so a change can take its place in any of them.
subscription ProfileShareChanged {
  profileShareChanged {
    shareId
    offersEdge: householdSharesEdge(statuses: [PENDING]) {
      cursor
      orderKey
    }
    visitorsEdge: householdSharesEdge(statuses: [ACTIVE], visitorsOnly: true) {
      cursor
      orderKey
    }
    profileEdge: profileSharesEdge {
      cursor
      orderKey
    }
    share {
      ...ShareOfferFields
      ...ProfileShareFields
      ...VisitorShareFields
    }
  }
}
