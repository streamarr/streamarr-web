query SharingOverview($householdId: ID!, $profileId: ID!) {
  pendingShareOffers(householdId: $householdId, first: 50) {
    edges {
      node {
        id
        profileId
        householdId
        status
        expiresAt
      }
    }
  }
  profileShares(profileId: $profileId, first: 50) {
    edges {
      node {
        id
        householdId
        status
        requiredByAccountMembership
      }
    }
  }
}

query ProfileSharePreview($profileId: ID!, $householdId: ID!) {
  profileSharePreview(profileId: $profileId, householdId: $householdId) {
    wouldLock
    nameConflict
  }
}

mutation OfferProfileShare($input: OfferProfileShareInput!) {
  offerProfileShare(input: $input) {
    share {
      id
      status
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
    }
  }
}

