query ShareOffers($householdId: ID!) {
  householdShares(householdId: $householdId, statuses: [PENDING], first: 50) {
    edges {
      node {
        ...ShareOfferFields
      }
    }
  }
}

query ProfileShares($profileId: ID!) {
  profileShares(profileId: $profileId, first: 50) {
    edges {
      node {
        ...ProfileShareFields
      }
    }
  }
}

query ProfileSharePreview($profileId: ID!, $shareCode: String!) {
  profileSharePreview(profileId: $profileId, shareCode: $shareCode) {
    wouldLock
    nameConflict
  }
}

mutation LookUpShareCode($input: LookUpShareCodeInput!) {
  lookUpShareCode(input: $input) {
    householdName
    userErrors {
      __typename
      ... on MutationError {
        message
      }
    }
  }
}

mutation OfferProfileShare($input: OfferProfileShareInput!) {
  offerProfileShare(input: $input) {
    share {
      id
      status
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
    }
  }
}

