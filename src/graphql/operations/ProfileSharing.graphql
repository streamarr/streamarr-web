fragment SharedProfileFields on ProfileSummary {
  id
  name
  picture
  kind
  personalProfile
  restricted
}

# An offer as Share offers lists it.
fragment ShareOfferFields on ProfileShare {
  id
  profileId
  householdId
  status
  expiresAt
  profile {
    ...SharedProfileFields
  }
  offeredByDisplayName
  visitor
}

# A share of the Account's Personal Profile as Sharing lists it.
fragment ProfileShareFields on ProfileShare {
  id
  householdId
  status
  requiredByAccountMembership
  expiresAt
  endedAt
  invalidationReason
  household {
    id
    name
  }
}
