query Me {
  me {
    accountId
    email
    displayName
    serverAdmin
    scope
    deviceBound
    householdRole
    household {
      id
      name
    }
    contextHousehold {
      id
      name
    }
    usableHouseholds(first: 20) {
      edges {
        node {
          membership
          household {
            id
            name
          }
        }
      }
    }
    selectableProfiles(first: 100) {
      edges {
        node {
          id
          name
          picture
          kind
          personal
          pinConfigured
          locked
          selected
        }
      }
    }
    selectedProfile {
      id
      name
    }
  }
}
