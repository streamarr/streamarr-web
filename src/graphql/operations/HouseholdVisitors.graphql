query SharedWithHousehold($householdId: ID!, $after: String) {
  householdShares(
    householdId: $householdId
    statuses: [ACTIVE]
    visitorsOnly: true
    first: 50
    after: $after
  ) {
    edges {
      cursor
      node {
        ...VisitorShareFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# A Profile shared with the Household as Shared with us lists it.
fragment VisitorShareFields on ProfileShare {
  id
  profileId
  householdId
  status
  requiredByAccountMembership
  profile {
    ...SharedProfileFields
  }
  offeredByDisplayName
  visitor
}

query VisitorDevices($householdId: ID!, $after: String) {
  householdDevices(householdId: $householdId, visitorsOnly: true, first: 50, after: $after) {
    edges {
      cursor
      node {
        id
        householdId
        displayName
        authorizingAccountDisplayName
        status
        pairedAt
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation RevokeDeviceRegistration($input: RevokeDeviceRegistrationInput!) {
  revokeDeviceRegistration(input: $input) {
    registrationId
    userErrors {
      __typename
      ... on MutationError {
        message
      }
    }
  }
}
