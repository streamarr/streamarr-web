fragment IdleSegmentRetentionSettingFields on IdleSegmentRetentionSetting {
  __typename
  minutes
  minimumMinutes
  maximumMinutes
}

query IdleSegmentRetentionSetting {
  idleSegmentRetentionSetting {
    ...IdleSegmentRetentionSettingFields
  }
}

mutation ChangeIdleSegmentRetention($input: ChangeIdleSegmentRetentionInput!) {
  changeIdleSegmentRetention(input: $input) {
    idleSegmentRetentionSetting {
      ...IdleSegmentRetentionSettingFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on InputMutationError {
        inputPath
      }
    }
  }
}
