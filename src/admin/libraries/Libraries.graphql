fragment ManagedLibraryFields on Library {
  __typename
  id
  name
  type
  backend
  filepathUri
  status
  scanStartedOn
  scanCompletedOn
}

query AdminLibraries {
  libraries {
    ...ManagedLibraryFields
  }
}

mutation AddLibrary($input: AddLibraryInput!) {
  addLibrary(input: $input) {
    library {
      ...ManagedLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on InputMutationError {
        inputPath
      }
    }
  }
}

mutation StartLibraryScan($input: StartLibraryScanInput!) {
  startLibraryScan(input: $input) {
    library {
      ...ManagedLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryBusyError {
        status
      }
    }
  }
}

mutation StartLibraryRefresh($input: StartLibraryRefreshInput!) {
  startLibraryRefresh(input: $input) {
    library {
      ...ManagedLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryBusyError {
        status
      }
    }
  }
}

mutation RemoveLibrary($input: RemoveLibraryInput!) {
  removeLibrary(input: $input) {
    removedLibraryId
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryBusyError {
        status
      }
    }
  }
}
