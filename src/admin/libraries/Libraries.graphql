query AdminLibraries {
  libraries {
    ...AdminLibraryFields
  }
}

mutation AddLibrary($input: AddLibraryInput!) {
  addLibrary(input: $input) {
    library {
      ...AdminLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on InputMutationError {
        inputPath
      }
    }
  }
}

mutation StartLibraryScan($input: StartLibraryScanInput!) {
  startLibraryScan(input: $input) {
    library {
      ...AdminLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryBusyError {
        status
      }
    }
  }
}

mutation StartLibraryRefresh($input: StartLibraryRefreshInput!) {
  startLibraryRefresh(input: $input) {
    library {
      ...AdminLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryBusyError {
        status
      }
    }
  }
}

mutation StopLibraryScan($input: StopLibraryScanInput!) {
  stopLibraryScan(input: $input) {
    library {
      ...AdminLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryScanNotInProgressError {
        status
      }
    }
  }
}

mutation StopLibraryRefresh($input: StopLibraryRefreshInput!) {
  stopLibraryRefresh(input: $input) {
    library {
      ...AdminLibraryFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryRefreshNotInProgressError {
        status
      }
    }
  }
}

mutation RemoveLibrary($input: RemoveLibraryInput!) {
  removeLibrary(input: $input) {
    removedLibraryId
    userErrors {
      __typename
      ... on MutationError {
        message
      }
      ... on LibraryBusyError {
        status
      }
    }
  }
}
