fragment NotificationRetentionSettingFields on NotificationRetentionSetting {
  __typename
  id
  days
  minimumDays
  maximumDays
}

query NotificationRetentionSetting {
  notificationRetentionSetting {
    ...NotificationRetentionSettingFields
  }
}

mutation ChangeNotificationRetention($input: ChangeNotificationRetentionInput!) {
  changeNotificationRetention(input: $input) {
    notificationRetentionSetting {
      ...NotificationRetentionSettingFields
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
    }
  }
}
