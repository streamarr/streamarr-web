fragment PlaybackSessionFields on PlaybackSession {
  id
  formatAttemptCount
  maximumFormatAttempts
  requestedChoice
  playbackChoice
  formatChange
  offeredChoices
  currentFormatAttempt {
    __typename
    ... on PendingPlaybackFormatAttempt {
      streamSessionId
    }
    ... on ReadyPlaybackFormatAttempt {
      streamSession {
        __typename
        id
        streamUrl
        ... on HlsStreamSession {
          transcodeMode
          videoRange
          mediaEndSeconds
        }
      }
    }
    ... on FailedPlaybackFormatAttempt {
      streamSessionId
      error {
        __typename
        ... on MutationError {
          message
        }
      }
    }
  }
}
