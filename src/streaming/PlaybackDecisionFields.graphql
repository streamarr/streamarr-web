fragment PlaybackDecisionFields on PlaybackDecision {
  formatAttempt
  streamSessionId
  video {
    delivery
    source {
      ...VideoFormatFields
    }
    output {
      ...VideoFormatFields
    }
  }
  audio {
    delivery
    source {
      ...AudioFormatFields
    }
    output {
      ...AudioFormatFields
    }
  }
  reasons
}

fragment VideoFormatFields on VideoFormat {
  codec
  width
  height
  frameRate
  bitrate
  videoRange
  dolbyVision
  details {
    codecProfile
    codecLevel
    bitDepth
    chromaSubsampling
    compatibleBase
    hdr10Plus
    dolbyVision {
      presence
      profile
      level
      baseLayerCompatibilityId
      enhancementLayer
      observedRpu
    }
    masteringDisplay {
      minLuminance
      maxLuminance
    }
    contentLightLevel {
      maxContentLightLevel
      maxFrameAverageLightLevel
    }
    bitstreamRewrites
  }
}

fragment AudioFormatFields on AudioFormat {
  codec
  channels
  bitrate
}
