query PlayerSubtitleModes($id: ID!, $movie: Boolean!) {
  movie(id: $id) @include(if: $movie) {
    __typename
    id
    languagePreference {
      ...LanguagePreferenceFields
    }
  }
  episode(id: $id) @skip(if: $movie) {
    __typename
    id
    languagePreference {
      ...LanguagePreferenceFields
    }
    season {
      __typename
      id
      languagePreference {
        ...LanguagePreferenceFields
      }
    }
  }
  me {
    __typename
    languagePreferences {
      ...ProfileLanguagePreferencesFields
    }
  }
}
