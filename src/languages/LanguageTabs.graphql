fragment LanguagePreferenceFields on LanguagePreference {
  __typename
  audioLanguages
  subtitleLanguage
  subtitleMode
  audioSource
  subtitleSource
}

query LanguageTabs($id: ID!, $movie: Boolean!, $series: Boolean!, $season: Boolean!) {
  movie(id: $id) @include(if: $movie) {
    __typename
    id
    languagePreference {
      ...LanguagePreferenceFields
    }
  }
  series(id: $id) @include(if: $series) {
    __typename
    id
    languagePreference {
      ...LanguagePreferenceFields
    }
  }
  season(id: $id) @include(if: $season) {
    __typename
    id
    languagePreference {
      ...LanguagePreferenceFields
    }
    series {
      __typename
      id
      languagePreference {
        ...LanguagePreferenceFields
      }
    }
  }
  me {
    __typename
    languagePreferences {
      ...ProfileLanguagePreferencesFields
    }
  }
}

mutation SetLanguageOverride($input: SetLanguageOverrideInput!) {
  setLanguageOverride(input: $input) {
    item {
      __typename
      ... on Movie {
        id
        languagePreference {
          ...LanguagePreferenceFields
        }
      }
      ... on Series {
        id
        languagePreference {
          ...LanguagePreferenceFields
        }
      }
      ... on Season {
        id
        languagePreference {
          ...LanguagePreferenceFields
        }
      }
      ... on Episode {
        id
        languagePreference {
          ...LanguagePreferenceFields
        }
      }
    }
    userErrors {
      __typename
      ... on MutationError {
        message
      }
    }
  }
}
