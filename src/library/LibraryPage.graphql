query LibraryPage($libraryId: ID!, $first: Int, $after: String, $last: Int, $before: String, $sort: MediaSort, $filter: MediaFilter) {
  library(id: $libraryId) {
    id
    name
    status
    scanCompletedOn
    alphabetIndex {
      letter
      count
    }
    items(first: $first, after: $after, last: $last, before: $before, sort: $sort, filter: $filter) {
      edges {
        cursor
        node {
          ...MediaSummaryFields
        }
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
        startCursor
        endCursor
      }
    }
  }
}
