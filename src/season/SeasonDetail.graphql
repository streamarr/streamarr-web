query SeasonDetail($id: ID!) {
  season(id: $id) {
    id
    title
    seasonNumber
    overview
    airDate
    selectedProfileState {
      watchState {
        watchStatus
      }
    }
    series {
      id
      title
      contentRating {
        value
      }
      directors {
        id
        name
      }
      seasons {
        id
        seasonNumber
        title
        selectedProfileState {
          watchState {
            watchStatus
          }
        }
        episodes {
          id
          selectedProfileState {
            watchState {
              watchStatus
            }
          }
        }
      }
      backdropImages: images(type: BACKDROP) {
        ...ImageWithAmbientFields
      }
    }
    episodes {
      id
      title
      episodeNumber
      runtime
      selectedProfileState {
        watchState {
          watchStatus
          watchProgress {
            positionSeconds
            percentComplete
            durationSeconds
          }
        }
      }
      files {
        id
      }
      stillImages: images(type: STILL) {
        aspectRatio
        blurHash
        variants {
          id
          size
          width
          height
          url
        }
      }
    }
    backdropImages: images(type: BACKDROP) {
      ...ImageWithAmbientFields
    }
    posterImages: images(type: POSTER) {
      ...ImageWithAmbientFields
    }
  }
}
