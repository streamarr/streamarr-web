sonar.projectKey=streamarr_streamarr-web
sonar.organization=streamarr

# The whole repository, as Automatic Analysis saw it: the app, its tooling, and the workflows.
# Files ignored by Git (node_modules, dist, coverage) are skipped by the scanner itself.
# Tests are colocated with the code, so the two sets are split by pattern and must stay disjoint:
# every pattern in sonar.test.inclusions is repeated in sonar.exclusions.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,e2e/**,vitest.setup.ts

# After the test patterns: vendored from streamarr-server and streamarr-ux, or generated from them.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,e2e/**,vitest.setup.ts,\
  src/graphql/schema/**,src/graphql/generated/**,src/api/openapi.json,src/api/generated/**,\
  src/routeTree.gen.ts,src/styles/tokens.generated.css

# Matches the coverage exclusions in vitest.config.ts, plus the Node tooling Vitest never loads.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/sw/sw.ts,src/auth/renewal-worker.ts,scripts/**,\
  *.config.ts,*.config.js,*.config.cjs,codegen.ts

# The player streams the library's own media, which carries no caption track yet. The ESLint
# directive that used to silence this rule named a plugin that does not support ESLint 10.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4084
sonar.issue.ignore.multicriteria.e1.resourceKey=src/streaming/Player.tsx
# The watched badge draws its own track and fill; role="progressbar" with aria-value* carries the
# semantics a native <progress> would, without per-browser pseudo-element styling.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=src/media/WatchedBadge.tsx

sonar.qualitygate.wait=true
