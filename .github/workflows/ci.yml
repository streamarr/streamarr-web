name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # SonarCloud attributes new code from the full history; a shallow clone hides it.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No dependency needs its lifecycle scripts here, so none of them run.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # streamarr-server is public; GITHUB_TOKEN only lifts the anonymous API rate limit.
      - name: Verify the vendored server contract matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run codegen:check
      - run: npm run build
      # Fork and Dependabot pull requests cannot see secrets; their code is analyzed once it
      # reaches main. Everywhere else a missing token fails the build rather than skipping the gate.
      - name: Require the SonarCloud token
        id: sonar
        if: >-
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.ORG_SONAR_TOKEN }}
        run: |
          : "${SONAR_TOKEN:?Grant this repository access to ORG_SONAR_TOKEN}"
          echo "analyze=true" >> "$GITHUB_OUTPUT"
      - name: Analyze coverage and require the SonarCloud quality gate
        if: steps.sonar.outputs.analyze == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.ORG_SONAR_TOKEN }}
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node_modules/.bin/playwright install --with-deps chromium
      # The cache holds only the browser; the OS packages it needs are not cached.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: node_modules/.bin/playwright install-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      # streamarr-ux is private: STREAMARR_UX_TOKEN is a fine-grained PAT with Contents: read on it.
      - name: Verify design tokens match the pinned streamarr-ux ref
        env:
          GH_TOKEN: ${{ secrets.STREAMARR_UX_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo '::error::STREAMARR_UX_TOKEN missing'
              exit 1
            fi
            echo '::warning::STREAMARR_UX_TOKEN not visible (fork PRs cannot see secrets) — token drift gate skipped'
            exit 0
          fi
          npm run tokens:check
