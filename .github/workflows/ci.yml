name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Local dev and the lockfile are npm 11; node 22 ships npm 10, whose
      # lock completeness rules disagree with 11 in both directions (missing
      # @emnapi entries one way, missing lightningcss platform optionals the
      # other). One npm authors the lock, the same npm consumes it.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      # The committed schema and generated client must match the pinned server commit exactly;
      # streamarr-server is public, so no token is needed to pull the SDL.
      - name: Verify the GraphQL contract matches the pinned server schema
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run codegen:check
      - run: npm run build
      - run: npm run typecheck
      # The browser suite drives the real vite dev server (playwright.config.ts
      # starts it plus the stub API) because dev-mode wiring — service-worker
      # scope, proxy headers, watcher behavior — is invisible to both the unit
      # tests and the production build.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The page-state-at-failure snapshots are what make a red run debuggable
      # without reproducing locally.
      - name: Upload browser failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
      # streamarr-ux is private, so this gate needs a read token for it
      # (fine-grained PAT with Contents: read on streamarr/streamarr-ux,
      # stored as STREAMARR_UX_TOKEN). Until the secret exists the step
      # warns and passes — a skipped gate must never be a silent one.
      - name: Verify design tokens match the pinned streamarr-ux ref
        env:
          GH_TOKEN: ${{ secrets.STREAMARR_UX_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::STREAMARR_UX_TOKEN not set — token drift gate skipped"
            exit 0
          fi
          npm run tokens:check
