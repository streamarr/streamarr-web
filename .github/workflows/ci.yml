name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The FFmpeg build that the transcode worker ships, and the checksum of its x64 Linux archive.
  FFMPEG_RELEASE: v8.1.3-2-streamarr.1
  FFMPEG_SHA256: 5a84a25963ef72e52aa042259b6be563abf734799556660fe1d1fc8879b15b2c

# The jobs run side by side. The last one, build, is the check that main requires.
jobs:
  static:
    name: Check formatting, lint, types and the production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  contracts:
    name: Verify the server contract and the design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
      # streamarr-server is public; GITHUB_TOKEN only lifts the anonymous API rate limit.
      - name: Verify the vendored server contract matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run codegen:check
      # streamarr-ux is private: STREAMARR_UX_TOKEN is a fine-grained PAT with Contents: read on it.
      - name: Verify design tokens match the pinned streamarr-ux ref
        env:
          GH_TOKEN: ${{ secrets.STREAMARR_UX_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo '::error::STREAMARR_UX_TOKEN missing'
              exit 1
            fi
            echo '::warning::STREAMARR_UX_TOKEN not visible (fork PRs cannot see secrets) — token drift gate skipped'
            exit 0
          fi
          npm run tokens:check

  unit:
    name: Run the unit tests and analyze coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # SonarCloud attributes new code from the full history; a shallow clone hides it.
          fetch-depth: 0
      - uses: ./.github/actions/install
      - run: npm run test:coverage
      # Fork and Dependabot pull requests cannot see secrets; their code is analyzed once it
      # reaches main. Everywhere else a missing token fails the job rather than skipping the gate.
      - name: Require the SonarCloud token
        id: sonar
        if: >-
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.ORG_SONAR_TOKEN }}
        run: |
          : "${SONAR_TOKEN:?Grant this repository access to ORG_SONAR_TOKEN}"
          echo "analyze=true" >> "$GITHUB_OUTPUT"
      - name: Analyze coverage and require the SonarCloud quality gate
        if: steps.sonar.outputs.analyze == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.ORG_SONAR_TOKEN }}

  # Each shard starts its own API stub, so the shards run the suite's spec files side by side.
  browser:
    name: Run the browser suite in Chromium (${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node_modules/.bin/playwright install --with-deps chromium
      # The cache holds only the browser; the OS packages it needs are not cached.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: node_modules/.bin/playwright install-deps chromium
      - name: Set up FFmpeg, which writes the 7.1 channel-order and quality-ladder streams
        uses: streamarr/streamarr-workflows/.github/actions/setup-ffmpeg@76cd4dd76bce93283d0ccb7ba08429248b6f18f1
        with:
          release: ${{ env.FFMPEG_RELEASE }}
          sha256: ${{ env.FFMPEG_SHA256 }}
      - run: npm run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload browser test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Firefox and WebKit run only the capability specs, and the runner's Google Chrome only the 7.1
  # channel-order spec.
  decoding-info:
    name: Run the capability specs in Firefox, WebKit and Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox-webkit
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node_modules/.bin/playwright install --with-deps firefox webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: node_modules/.bin/playwright install-deps firefox webkit
      - name: Set up FFmpeg, which writes the 7.1 channel-order streams
        uses: streamarr/streamarr-workflows/.github/actions/setup-ffmpeg@76cd4dd76bce93283d0ccb7ba08429248b6f18f1
        with:
          release: ${{ env.FFMPEG_RELEASE }}
          sha256: ${{ env.FFMPEG_SHA256 }}
      - name: Install PulseAudio
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pulseaudio
      # WebKit stalled Opus streams under PulseAudio in a local container, so it runs before it starts.
      - run: npm run test:e2e -- --project=webkit --project=chrome
      # Firefox runs no audio graph without an audio server; PulseAudio gives it a null sink.
      - name: Start PulseAudio
        if: ${{ !cancelled() }}
        run: pulseaudio --start --exit-idle-time=-1
      # Separate output and report directories keep the first run's results and report for the
      # upload: the HTML reporter clears its directory before it writes.
      - if: ${{ !cancelled() }}
        run: npm run test:e2e -- --project=firefox --output=test-results/firefox
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/firefox
      - name: Upload the decodingInfo answers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decoding-info-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # GitHub counts a skipped required check as passing, and it skips a job whose needs did not all
  # succeed. always() keeps this job running, so a job that failed, timed out or was cancelled fails
  # the required check.
  build:
    name: build
    needs: [static, contracts, unit, browser, decoding-info]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: streamarr/streamarr-workflows/.github/actions/require-jobs@76cd4dd76bce93283d0ccb7ba08429248b6f18f1
        with:
          jobs: ${{ toJSON(needs) }}
