name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      # streamarr-server is public; GITHUB_TOKEN only lifts the anonymous API rate limit.
      - name: Verify the vendored server contract matches the pinned commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run codegen:check
      - run: npm run build
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The cache holds only the browser; the OS packages it needs are not cached.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      # streamarr-ux is private: STREAMARR_UX_TOKEN is a fine-grained PAT with Contents: read on it.
      - name: Verify design tokens match the pinned streamarr-ux ref
        env:
          GH_TOKEN: ${{ secrets.STREAMARR_UX_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo '::error::STREAMARR_UX_TOKEN missing'
              exit 1
            fi
            echo '::warning::STREAMARR_UX_TOKEN not visible (fork PRs cannot see secrets) — token drift gate skipped'
            exit 0
          fi
          npm run tokens:check
